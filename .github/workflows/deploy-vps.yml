name: Deploy ONCHAIN-HUNTER to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: onchain-hunter-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/ONCHAIN-HUNTER
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 delete onchain-hunter >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs --only onchain-hunter --update-env
            pm2 save
            pm2 startup systemd -u root --hp /root >/tmp/onchain-hunter-pm2-startup.txt 2>&1 || true

            echo "Checking ONCHAIN-HUNTER service..."
            for i in {1..12}; do
              if curl -fsS http://127.0.0.1:3200/api/health >/tmp/onchain-hunter-health.json; then
                cat /tmp/onchain-hunter-health.json
                break
              fi
              sleep 2
            done
            test -s /tmp/onchain-hunter-health.json

            echo "Checking ONCHAIN-HUNTER status API..."
            status_code="$(curl -sS -o /tmp/onchain-hunter-status.json -w '%{http_code}' http://127.0.0.1:3200/api/status)"
            cat /tmp/onchain-hunter-status.json
            test "$status_code" = "200" || test "$status_code" = "401"

            echo "Checking public HTTPS endpoint..."
            curl -fsS --retry 5 --retry-delay 2 https://hunter.texvic.tech/api/health >/tmp/onchain-hunter-public-health.json
            cat /tmp/onchain-hunter-public-health.json
