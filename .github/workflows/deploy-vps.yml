name: Deploy ONCHAIN-HUNTER to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: onchain-hunter-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/ONCHAIN-HUNTER
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 delete onchain-hunter >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs --only onchain-hunter --update-env
            pm2 save

            echo "Checking ONCHAIN-HUNTER service..."
            sleep 5
            if pm2 pid onchain-hunter | grep -q '[0-9]'; then
              echo "ONCHAIN-HUNTER is running"
              pm2 logs onchain-hunter --lines 5 --nostream
            else
              echo "WARNING: ONCHAIN-HUNTER may not be running"
              pm2 status
              exit 1
            fi
