name: Deploy ONCHAIN-HUNTER to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: onchain-hunter-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /root/ONCHAIN-HUNTER
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            if pm2 describe onchain-hunter >/dev/null 2>&1; then
              pm2 restart onchain-hunter --update-env
            else
              pm2 start dist/autonomous.js --name onchain-hunter --update-env
            fi
            pm2 save
